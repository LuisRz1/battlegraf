services:
  postgres:
    image: postgres:16-alpine
    container_name: battlegraf-db
    environment:
      POSTGRES_USER: battlegraf
      POSTGRES_PASSWORD: battlegraf_dev
      POSTGRES_DB: battlegraf
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U battlegraf"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: battlegraf-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: battlegraf-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: battlegraf-api
    environment:
      DATABASE_URL: postgresql+asyncpg://battlegraf:battlegraf_dev@postgres:5432/battlegraf
      DATABASE_URL_SYNC: postgresql+psycopg://battlegraf:battlegraf_dev@postgres:5432/battlegraf
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      MINIO_ENDPOINT: minio:9000
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-docker-secret-change-me}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: battlegraf-celery
    command: celery -A src.infrastructure.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://battlegraf:battlegraf_dev@postgres:5432/battlegraf
      DATABASE_URL_SYNC: postgresql+psycopg://battlegraf:battlegraf_dev@postgres:5432/battlegraf
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  miniodata:
